<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات — لوحة التحكم </title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Forum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>
<body>


  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-logo">
      
      <span>لوحة الإدارة</span>
    </a>

    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item"><ion-icon name="speedometer-outline"></ion-icon>نظرة عامة</a>
      <a href="menu.html" class="nav-item"><ion-icon name="restaurant-outline"></ion-icon>محرر القائمة</a>
      <a href="orders.html" class="nav-item"><ion-icon name="receipt-outline"></ion-icon>الطلبات</a>
      <a href="employees.html" class="nav-item{active_employees}"><ion-icon name="people-outline"></ion-icon>الموظفون</a>

      <a href="export.html" class="nav-item"><ion-icon name="download-outline"></ion-icon>تصدير القائمة</a>
      <a href="billing.html" class="nav-item"><ion-icon name="card-outline"></ion-icon>الاشتراك والفواتير</a>
      <a href="settings.html" class="nav-item active"><ion-icon name="settings-outline"></ion-icon>الإعدادات</a>
      <a href="../index.html" class="nav-item"><ion-icon name="globe-outline"></ion-icon>عرض الموقع</a>
    </nav>

    <div class="sidebar-user">
      <div class="avatar">م</div>
      <span>مدير المطعم</span>
    </div>
  </aside>
  <div class="overlay" data-overlay></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" data-menu-btn><ion-icon name="menu-outline"></ion-icon></button>
      <div class="page-title">
        <h1>الإعدادات</h1>
        <p>معلومات المطعم الأساسية</p>
      </div>
    </header>

    <section class="card" style="max-width: 640px">
      <div class="form-grid">
        <div class="form-group">
          <label>اسم المطعم</label>
          <input type="text" id="set-name" placeholder="أدخل اسم المطعم">
        </div>
        <div class="form-group">
          <label>رقم الهاتف</label>
          <input type="text" id="set-phone" placeholder="+213555123456" dir="ltr">
        </div>
        <div class="form-group full">
          <label>العنوان</label>
          <input type="text" id="set-address" placeholder="أدخل عنوان المطعم">
        </div>
        <div class="form-group">
          <label>نسبة الضريبة (%)</label>
          <input type="number" id="set-tax" min="0" max="100" step="0.1" value="19">
        </div>
        <div class="form-group">
          <label>عدد الطاولات</label>
          <input type="number" id="set-tables" min="1" value="8">
        </div>
      </div>
      <div class="modal-actions" style="justify-content: flex-start">
        <button class="btn btn-gold" onclick="saveSettings()"><ion-icon name="save-outline"></ion-icon>حفظ الإعدادات</button>
      </div>
    </section>
  </main>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>

    if (!window.supabase) document.write('<script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');
    if (!window.supabase) document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  </script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/settings.js"></script>
</body>
</html>
