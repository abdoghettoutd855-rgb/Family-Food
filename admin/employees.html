<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الموظفون — لوحة التحكم </title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Forum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="sidebar-logo">
      
      <span>لوحة الإدارة</span>
    </a>

    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item active"><ion-icon name="speedometer-outline"></ion-icon>نظرة عامة</a>
      <a href="menu.html" class="nav-item"><ion-icon name="restaurant-outline"></ion-icon>محرر القائمة</a>
      <a href="orders.html" class="nav-item"><ion-icon name="receipt-outline"></ion-icon>الطلبات</a>
      <a href="employees.html" class="nav-item active"><ion-icon name="people-outline"></ion-icon>الموظفون</a>

      <a href="export.html" class="nav-item"><ion-icon name="download-outline"></ion-icon>تصدير القائمة</a>
      <a href="billing.html" class="nav-item"><ion-icon name="card-outline"></ion-icon>الاشتراك والفواتير</a>
      <a href="settings.html" class="nav-item"><ion-icon name="settings-outline"></ion-icon>الإعدادات</a>
      <a href="../index.html" class="nav-item"><ion-icon name="globe-outline"></ion-icon>عرض الموقع</a>
    </nav>

    <div class="sidebar-user">
      <div class="avatar">م</div>
      <span>مدير المطعم</span>
    </div>
  </aside>
  <div class="overlay" data-overlay></div>


  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" data-menu-btn><ion-icon name="menu-outline"></ion-icon></button>
      <div class="page-title">
        <h1>الموظفون</h1>
        <p>إدارة فريق العمل — كل الحقول حرة، اكتب ما تشاء</p>
      </div>
      <button class="btn btn-gold" onclick="openEmpForm()"><ion-icon name="add-outline"></ion-icon><span>عامل جديد</span></button>
    </header>

    <div class="toolbar">
      <input type="search" class="search-input" id="emp-search" placeholder="ابحث بالاسم أو المنصب...">
    </div>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>الاسم</th><th>المنصب</th><th>الهاتف</th><th>الراتب</th><th>تاريخ التعيين</th><th>إجراءات</th></tr>
          </thead>
          <tbody id="emp-body"></tbody>
        </table>
      </div>
    </section>
  </main>


  <div class="modal" id="emp-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="emp-modal-title">عامل جديد</h2>
        <button class="modal-close" onclick="closeModal('emp-modal')"><ion-icon name="close-outline"></ion-icon></button>
      </div>
      <form id="emp-form" class="form-grid" onsubmit="return false">
        <input type="hidden" id="emp-id">
        <div class="form-group full">
          <label>الاسم الكامل *</label>
          <input type="text" id="emp-name" placeholder="اكتب أي اسم..." required>
        </div>
        <div class="form-group">
          <label>المنصب *</label>
          <input type="text" id="emp-position" placeholder="طباخ، نادل، مدير..." required>
        </div>
        <div class="form-group">
          <label>الهاتف</label>
          <input type="text" id="emp-phone" placeholder="+213..." dir="ltr">
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="emp-email" placeholder="email@example.com" dir="ltr">
        </div>
        <div class="form-group">
          <label>الراتب (دج)</label>
          <input type="number" id="emp-salary" min="0" step="any" placeholder="0">
        </div>
        <div class="form-group">
          <label>تاريخ التعيين</label>
          <input type="date" id="emp-hire">
        </div>
      </form>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('emp-modal')">إلغاء</button>
        <button class="btn btn-gold" onclick="saveEmp()"><ion-icon name="checkmark-outline"></ion-icon>حفظ</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* بدائل تلقائية إذا كان CDN الأساسي محجوباً */
    if (!window.supabase) document.write('<script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');
    if (!window.supabase) document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  </script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/employees.js"></script>
</body>
</html>
