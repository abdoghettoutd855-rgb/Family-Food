<!DOCTYPE html>

      <a href="orders.html" class="nav-item"><ion-icon name="receipt-outline"></ion-icon>الطلبات</a>
      <a href="employees.html" class="nav-item{active_employees}"><ion-icon name="people-outline"></ion-icon>الموظفون</a>

    </div>

      <div class="page-title">

      <button class="btn btn-gold" onclick="window.print()"><ion-icon name="print-outline"></ion-icon><span>طباعة / PDF</span></button>
    </header>

    <section class="card export-menu" id="export-content">
      <div class="export-header">
        
        <h1 id="export-rest-name">المطعم</h1>
        <p id="export-rest-phone" style="color: var(--quick-silver)"></p>
      </div>
      <div id="export-categories"></div>
      <div class="export-footer" id="export-footer"></div>
    </section>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    if (!window.supabase) document.write('<script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');
    if (!window.supabase) document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');

  <script src="assets/js/config.js"></script>
